<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="jet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="24" fill="url(#core)" opacity="0.3"/>
  <!-- Orbital ring 1 -->
  <ellipse cx="32" cy="32" rx="22" ry="10" stroke="url(#ring1)" stroke-width="1.5" fill="none" transform="rotate(-25 32 32)" opacity="0.7"/>
  <!-- Orbital ring 2 -->
  <ellipse cx="32" cy="32" rx="20" ry="12" stroke="#00d4ff" stroke-width="1" fill="none" transform="rotate(15 32 32)" opacity="0.4"/>
  <!-- Core sphere -->
  <circle cx="32" cy="32" r="8" fill="url(#core)"/>
  <circle cx="32" cy="32" r="5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" opacity="0.9"/>
  <!-- Jet beam -->
  <line x1="38" y1="26" x2="56" y2="10" stroke="url(#jet)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="56" cy="10" r="2" fill="#00d4ff" opacity="0.6"/>
  <!-- Circuit traces (top-right) -->
  <path d="M50 14 L56 14 L56 8" stroke="#00d4ff" stroke-width="0.7" fill="none" opacity="0.3"/>
  <path d="M52 18 L58 18" stroke="#00d4ff" stroke-width="0.5" fill="none" opacity="0.2"/>
</svg>
