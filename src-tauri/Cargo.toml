[package]
name = "quasar"
version = "0.1.0"
description = "Unified IT operations console for remote access, monitoring, and automation"
authors = ["Quasar Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quasar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
# Tauri command signatures mirror the frontend API surface; splitting them into
# parameter structs would break the invoke() contract for no runtime benefit.
too_many_arguments = "allow"
type_complexity = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
argon2 = "0.5.3"
password-hash = { version = "0.5", features = ["getrandom"] }
aes-gcm = "0.10.3"
# rand 0.10 and surge-ping 0.9 are blocked until russh >= 0.62: russh 0.57
# pins rand_core =0.10.0-rc-3, which conflicts with stable rand_core 0.10.
rand = "0.9.2"
mdns-sd = "0.20"
ollama-rs = { version = "0.3.3", features = ["stream"] }
tokio-stream = "0.1"
russh = { version = "0.57.0", default-features = false, features = ["flate2", "rsa", "ring"] }
russh-sftp = { version = "2.3" }
tokio = { version = "1.49.0", features = ["full"] }
surge-ping = "0.8"
cidr-utils = "0.7"
futures = "0.3"
sysinfo = "0.33"
uuid = { version = "1.20.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = "1.8"
secrecy = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
subtle = "2"
regex = "1"
log = "0.4"
env_logger = "0.11"
rusqlite_migration = "1.2.0"
once_cell = "1.19"
sha2 = "0.10"
dns-lookup = "3.0"
cron = "0.17"

