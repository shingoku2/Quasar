[package]
name = "quasar"
version = "0.1.0"
description = "Unified IT operations console for remote access, monitoring, and automation"
authors = ["Quasar Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quasar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
# Tauri command signatures mirror the frontend API surface; splitting them into
# parameter structs would break the invoke() contract for no runtime benefit.
too_many_arguments = "allow"
type_complexity = "allow"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
argon2 = "0.5.3"
aes-gcm = "0.11.0"
rand = "0.10.2"
getrandom = "0.4.3"
mdns-sd = "0.20.3"
ollama-rs = { version = "0.3.6", features = ["stream"] }
tokio-stream = "0.1.19"
russh = { version = "0.62.5", default-features = false, features = ["flate2", "rsa", "ring"] }
russh-sftp = { version = "2.3.0" }
tokio = { version = "1.53.1", features = ["full"] }
surge-ping = "0.9.0"
cidr-utils = "0.7.1"
futures = "0.3.33"
sysinfo = "0.39.6"
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
zeroize = "1.9.0"
secrecy = "0.10.3"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
subtle = "2.6.1"
regex = "1.13.1"
log = "0.4.33"
env_logger = "0.11.11"
rusqlite_migration = "2.6.0"
once_cell = "1.21.4"
sha2 = "0.11.0"
dns-lookup = "3.0.1"
cron = "0.17.0"
