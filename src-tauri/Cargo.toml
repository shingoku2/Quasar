[package]
name = "quasar"
version = "0.1.0"
description = "Unified IT operations console for remote access, monitoring, and automation"
authors = ["Quasar Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quasar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
argon2 = "0.5.3"
password-hash = { version = "0.5", features = ["getrandom"] }
aes-gcm = "0.10.3"
rand = "0.9.2"
mdns-sd = "0.17.2"
ollama-rs = { version = "0.3.3", features = ["stream"] }
tokio-stream = "0.1"
russh = { version = "0.57.0", default-features = false, features = ["flate2", "rsa", "ring"] }
russh-keys = { version = "0.49.2" }
russh-sftp = { version = "2.0.4" }
tokio = { version = "1.49.0", features = ["full"] }
surge-ping = "0.7"
cidr-utils = "0.5"
futures = "0.3"
sysinfo = "0.33"
uuid = { version = "1.20.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
zeroize = "1.8"
secrecy = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
log = "0.4"
env_logger = "0.11"
rusqlite_migration = "1.2.0"
once_cell = "1.19"
sha2 = "0.10"
dns-lookup = "2.0"

