name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only token by default; no job here needs to write (CI-002).
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running checks (CI-009).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-lint:
    # Catches invalid workflow files (e.g. the `secrets` context in a step
    # `if:`, which silently broke release.yml for a month: CI-001). A file
    # GitHub rejects never runs, so without this nothing ever goes red.
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint 1.7.7 (checksum-pinned)
        run: |
          curl -sSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint

      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml

  frontend-checks:
    name: Frontend (Typecheck + Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          cache: npm

      # Node 24.15 ships npm 11; package.json engines require npm 12 (CI-004).
      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      # Runs the tests with coverage and fails below the thresholds in vite.config.ts.
      - name: Run frontend tests (with coverage floor)
        run: npm run coverage

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

  backend-checks:
    name: Backend (Clippy + Test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # Installs the toolchain pinned in rust-toolchain.toml (CI-005).
      - name: Setup Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  msrv:
    # Cargo.toml's rust-version is a promise; build it so it stays true (CI-005).
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95 --profile minimal

      - name: cargo check on the MSRV
        working-directory: src-tauri
        run: cargo +1.95 check --locked

  build:
    name: Build (${{ matrix.os }})
    needs: [frontend-checks, backend-checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          cache: npm

      # Node 24.15 ships npm 11; package.json engines require npm 12 (CI-004).
      - name: Use npm 12
        run: npm install -g npm@12.0.2

      # Installs the toolchain pinned in rust-toolchain.toml (CI-005).
      - name: Setup Rust
        run: rustup toolchain install

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      # This job is a cross-platform smoke build (does it compile and bundle
      # on each OS?), not a release — it has no TAURI_SIGNING_PRIVATE_KEY and
      # shouldn't need one. bundle.createUpdaterArtifacts is on in
      # tauri.conf.json for the real release build (release.yml, which does
      # have the signing key), but with it on here too `tauri build` refuses
      # to run at all ("A public key has been found, but no private key").
      # Disabling it for just this checkout keeps this job self-contained.
      - name: Disable updater artifacts for this smoke build
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          retention-days: 7
