name: Security audit

# New RustSec/GHSA advisories land against an unchanged lockfile. CI only audits on
# push/PR, so without a schedule nobody would see them until the next change (CI-006).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm + cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0

      # Node 24.15 ships npm 11; package.json engines require npm 12 (CI-004).
      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high --package-lock-only

      # Installs the toolchain pinned in rust-toolchain.toml (CI-005).
      - name: Setup Rust
        run: rustup toolchain install

      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
