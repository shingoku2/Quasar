name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  qodana:
    runs-on: ubuntu-latest
    # Caps a hung scan (GitHub's default is 6 h); above the 45 min configuration timeout below.
    timeout-minutes: 75
    # Read-only contents; write only where the action reports results (check-run
    # annotations and the PR summary comment).
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891 # v2026.1.3
        with:
          pr-mode: false
          # The Cargo project (and qodana.yaml) live in src-tauri/, not the repo root; the
          # Rust configuration stage (cargo metadata, build scripts) outlasts the 10 min default.
          args: -i,src-tauri,--property,qd.rust.configuration.timeout.minutes=45
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1667814189 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
