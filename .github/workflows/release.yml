name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the release job, which creates the draft release, can write.
permissions:
  contents: read

jobs:
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      # The tag becomes the app version the updater compares, so it must be semver
      # (`v1.2` or `vfoo` used to be stamped in as-is: CI-008).
      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          cache: npm

      # Node 24.15 ships npm 11; package.json engines require npm 12 (CI-004).
      - name: Use npm 12
        run: npm install -g npm@12.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # Installs the toolchain pinned in rust-toolchain.toml (CI-005).
      - name: Setup Rust
        run: rustup toolchain install


      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test

      # The release gate is at least as strict as the PR gate (CI-006).
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  release:
    name: Release (${{ matrix.os }})
    needs: [ci-checks]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # The `secrets` context isn't available in a step's `if:`, and using it
      # there makes GitHub reject the whole workflow file (CI-001). Evaluate it
      # once here, at job level where `secrets` is allowed, and test the env.
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.15.0
          cache: npm

      # Node 24.15 ships npm 11; package.json engines require npm 12 (CI-004).
      - name: Use npm 12
        run: npm install -g npm@12.0.2

      # Installs the toolchain pinned in rust-toolchain.toml (CI-005).
      - name: Setup Rust
        run: rustup toolchain install


      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      # tagName below only names the GitHub release — it doesn't touch the
      # packaged app version, which tauri.conf.json's "version" field pins
      # at 0.1.0. Without this, every build (and the latest.json the
      # updater compares against) would keep reporting 0.1.0 forever
      # regardless of the tag pushed, so an already-installed build would
      # never see a newer release as newer and the updater would silently
      # stop working after the very first release.
      - name: Stamp package version from release tag
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = version;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      # Windows builds sign via a certificate thumbprint in tauri.conf.json,
      # not an env var, so the cert has to be imported into the runner's
      # store and its thumbprint patched into the config before `tauri build`
      # runs. Skipped (both the import and the later Windows signing) when
      # WINDOWS_CERTIFICATE isn't configured, so forks/PRs without the secret
      # still produce an (unsigned) build. See docs/RELEASE_SIGNING.md.
      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate\cert.b64 -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate\cert.b64 certificate\cert.pfx
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath certificate\cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item -Recurse -Force certificate
          $thumbprint = $cert.Thumbprint
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.windows.certificateThumbprint='$thumbprint';fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');"

      # Unset secrets would otherwise reach the bundler as empty strings, and
      # whether it treats APPLE_CERTIFICATE="" as absent is unverified (CI-008).
      # Export only the ones that are set, and only on the macOS runner (CI-002).
      - name: Export Apple signing secrets that are set
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delim="EOF_$(openssl rand -hex 16)"
              { echo "$name<<$delim"; echo "$value"; echo "$delim"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts (.sig files) tauri.conf.json's
          # bundle.createUpdaterArtifacts asks for, so the updater plugin can
          # verify downloads against the pubkey embedded in the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization env comes from the export step above,
          # only for the secrets that are set. Every secret this step sees is
          # visible to the build, dependency build scripts included; that's
          # inherent to signing during `tauri build`.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Quasar ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
